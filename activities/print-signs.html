<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THIS / THAT signs · Computer Vision for Developers</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    @page { size: A4 landscape; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); background: #e9edf2; }
    .bar { padding: 16px; display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 15px; }
    .bar button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 999px; border: 0; background: var(--teal); color: #fff; cursor: pointer; }
    .bar a { color: var(--teal); }
    .sign { width: 297mm; height: 210mm; margin: 0 auto 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #fff; page-break-after: always; break-after: page; position: relative; overflow: hidden; }
    .sign:last-child { page-break-after: auto; break-after: auto; }
    .word { font-family: var(--font-display); font-weight: 700; font-size: 75mm; line-height: 1; letter-spacing: -0.02em; }
    .sign--this .word { color: var(--teal); }
    .sign--that .word { color: var(--coral); }
    .arrow { font-size: 30mm; line-height: 1; color: #c9d1dc; }
    .foot { position: absolute; bottom: 10mm; font-size: 5mm; color: #8a93a3; letter-spacing: .08em; text-transform: uppercase; }
    @media print { body { background: #fff; } .bar { display: none; } .sign { margin: 0; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
  <div class="bar"><button type="button" onclick="window.print()">Print both signs (A4 landscape)</button> <a href="./index.html">← All activities</a></div>
  <section class="sign sign--this"><div class="arrow">←</div><div class="word">THIS</div><p class="foot">Icebreaker · This or That · Day 1</p></section>
  <section class="sign sign--that"><div class="arrow">→</div><div class="word">THAT</div><p class="foot">Icebreaker · This or That · Day 1</p></section>
</body>
</html>
